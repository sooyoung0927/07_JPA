<!doctype html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>메뉴 가격 검색</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            padding: 50px;
            max-width: 600px;
            width: 100%;
            animation: slideUp 0.6s ease-out;
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        h1 {
            color: #333;
            font-size: 28px;
            font-weight: 700;
            margin-bottom: 15px;
            text-align: center;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        h3 {
            color: #666;
            font-size: 18px;
            font-weight: 500;
            margin-bottom: 40px;
            text-align: center;
            line-height: 1.6;
        }

        form {
            display: flex;
            flex-direction: column;
            gap: 25px;
        }

        .search-group {
            display: flex;
            align-items: center;
            gap: 10px;
            background: #f8f9fa;
            padding: 20px 25px;
            border-radius: 15px;
            border: 2px solid #e9ecef;
            transition: all 0.3s ease;
        }

        .search-group:focus-within {
            border-color: #667eea;
            box-shadow: 0 0 0 4px rgba(102, 126, 234, 0.1);
        }

        input[type="number"] {
            flex: 0 0 150px;
            padding: 12px 18px;
            border: 2px solid #667eea;
            border-radius: 10px;
            font-size: 18px;
            font-weight: 600;
            color: #333;
            text-align: center;
            transition: all 0.3s ease;
            background: white;
        }

        input[type="number"]:focus {
            outline: none;
            border-color: #764ba2;
            box-shadow: 0 0 0 4px rgba(118, 75, 162, 0.1);
        }

        input[type="number"]::-webkit-inner-spin-button,
        input[type="number"]::-webkit-outer-spin-button {
            opacity: 1;
            height: 40px;
        }

        .label-text {
            flex: 1;
            color: #555;
            font-size: 16px;
            font-weight: 500;
        }

        input[type="submit"] {
            padding: 16px 32px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 17px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(102, 126, 234, 0.4);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        input[type="submit"]:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(102, 126, 234, 0.6);
        }

        input[type="submit"]:active {
            transform: translateY(0);
            box-shadow: 0 2px 10px rgba(102, 126, 234, 0.4);
        }

        .icon {
            font-size: 24px;
            margin-right: 5px;
        }

        /* 반응형 디자인 */
        @media (max-width: 600px) {
            .container {
                padding: 30px 25px;
            }

            h1 {
                font-size: 24px;
            }

            h3 {
                font-size: 16px;
            }

            .search-group {
                flex-direction: column;
                align-items: stretch;
                text-align: center;
                padding: 20px;
            }

            input[type="number"] {
                flex: 1;
                width: 100%;
            }

            .label-text {
                order: -1;
                margin-bottom: 10px;
            }

            input[type="submit"] {
                padding: 14px 24px;
                font-size: 16px;
            }
        }

        /* 포커스 애니메이션 */
        @keyframes pulse {
            0%, 100% {
                opacity: 1;
            }
            50% {
                opacity: 0.8;
            }
        }

        .search-group:focus-within .label-text {
            animation: pulse 2s ease-in-out infinite;
        }
    </style>
</head>
<body>
<div class="container">
    <h1>🔍 JPA Query Method</h1>
    <h3>입력한 가격을 초과하는 메뉴 조회하기 TEST</h3>

    <form action="/menu/search" method="get">
        <div class="search-group">
            <input type="number" name="menuPrice" placeholder="0" min="0" step="100" required>
            <span class="label-text">원을 초과하는<br> 메뉴 목록 조회</span>
        </div>

        <input type="submit" value="🔎 검색하기">
    </form>
</div>
</body>
</html>
