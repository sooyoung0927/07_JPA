<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 40px 20px;
        }

        h1 {
            color: white;
            font-size: 32px;
            font-weight: 700;
            margin-bottom: 30px;
            text-align: center;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.2);
            animation: fadeIn 0.6s ease-in;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(-20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        form {
            background: white;
            padding: 40px 50px;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            animation: slideUp 0.8s ease-out;
            max-width: 500px;
            width: 100%;
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        label {
            display: inline-block;
            width: 120px;
            color: #333;
            font-weight: 600;
            font-size: 15px;
            margin-bottom: 8px;
        }

        input[type="text"],
        input[type="number"],
        select {
            width: 100%;
            padding: 12px 16px;
            border: 2px solid #e9ecef;
            border-radius: 10px;
            font-size: 15px;
            color: #333;
            transition: all 0.3s ease;
            background: #f8f9fa;
        }

        input[type="text"]:focus,
        input[type="number"]:focus,
        select:focus {
            outline: none;
            border-color: #667eea;
            background: white;
            box-shadow: 0 0 0 4px rgba(102, 126, 234, 0.1);
        }

        br {
            display: block;
            content: "";
            margin-bottom: 20px;
        }

        select {
            cursor: pointer;
        }

        input[type="submit"] {
            width: 100%;
            padding: 16px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 17px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(102, 126, 234, 0.4);
            margin-top: 10px;
        }

        input[type="submit"]:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(102, 126, 234, 0.6);
        }

        input[type="submit"]:active {
            transform: translateY(0);
        }


    </style>
</head>
<body>
<h1>신규 메뉴 등록</h1>
<form action="/menu/regist" method="post">

    <label>메뉴 이름 :</label>
    <input type="text" name="menuName"><br>
    <label>메뉴 가격 :</label>
    <input type="number" name="menuPrice"><br>

    <label>카테고리 : </label>
    <select name="categoryCode" id="categoryCode"></select><br>
    <label>판매여부 : </label>
    <select name="orderableStatus">
        <option value="Y">가능</option>
        <option value="N">불가능</option>
    </select><br>
    <input type="submit" value="등록하기">
</form>

<script>
    // category 정보 담겨있음
    fetch('/menu/category') // 아직은 js 객체가 아닌 형태만 js
        .then(res => res.json()) // 형태만 js 인 녀석을 진짜 js객체로 변환
        .then(data => {

            // html 요소 취득하기
            const $categoryCode
                = document.getElementById("categoryCode");

            // data -> list 형태이기 때문에 반복문
            for(let index in data) {
                // 반복하는 만큼 option 태그 만들기
                const $option = document.createElement("option");
                $option.value = data[index].categoryCode;
                $option.textContent = data[index].categoryName;

                $categoryCode.appendChild($option);
            }
        })
</script>
</body>
</html>
