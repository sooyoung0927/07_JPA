<!doctype html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>전체 메뉴 조회</title>
    <!-- searchResult.html의 style 그대로 복붙 -->
</head>
<body>
<h3>전체 메뉴 목록</h3>
<table>
    <tr>
        <th>메뉴번호</th>
        <th>메뉴이름</th>
        <th>메뉴가격</th>
        <th>카테고리코드</th>
        <th>판매상태</th>
    </tr>
    <tr th:each="result : ${menuList}">
        <td th:text="${result.menuCode}"></td>
        <td th:text="${result.menuName}"></td>
        <td th:text="${result.menuPrice} + '원'"></td>
        <td th:text="${result.categoryCode}"></td>
        <td th:text="${result.orderableStatus}"></td>
    </tr>
</table>
</body>
</html>
