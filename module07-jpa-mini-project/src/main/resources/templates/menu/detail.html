<!doctype html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>메뉴 상세 조회</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            overflow: hidden;
            max-width: 800px;
            width: 100%;
            animation: fadeIn 0.5s ease-in;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(-20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            padding: 30px;
            text-align: center;
        }

        h1 {
            color: white;
            font-size: 28px;
            font-weight: 600;
            letter-spacing: -0.5px;
        }

        .table-wrapper {
            padding: 40px;
        }

        table {
            width: 100%;
            border-collapse: separate;
            border-spacing: 0;
            overflow: hidden;
        }

        th {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 18px 20px;
            text-align: left;
            font-weight: 600;
            font-size: 14px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        th:first-child {
            border-top-left-radius: 10px;
        }

        th:last-child {
            border-top-right-radius: 10px;
        }

        td {
            padding: 20px;
            background: #f8f9fa;
            color: #333;
            font-size: 16px;
            border-bottom: 1px solid #e9ecef;
        }

        tr:last-child td:first-child {
            border-bottom-left-radius: 10px;
        }

        tr:last-child td:last-child {
            border-bottom-right-radius: 10px;
        }

        tr:hover td {
            background: #e9ecef;
            transition: background 0.3s ease;
        }

        /* 반응형 디자인 */
        @media (max-width: 600px) {
            h1 {
                font-size: 22px;
            }

            .table-wrapper {
                padding: 20px;
                overflow-x: auto;
            }

            th, td {
                padding: 12px 10px;
                font-size: 14px;
            }

            th {
                font-size: 12px;
            }
        }

        /* 상태 뱃지 스타일 (판매상태용) */
        .status-badge {
            display: inline-block;
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 600;
        }

        .status-available {
            background: #d4edda;
            color: #155724;
        }

        .status-unavailable {
            background: #f8d7da;
            color: #721c24;
        }
    </style>
</head>
<body>
<div class="container">
    <div class="header">
        <h1>🍽️ 메뉴 상세 정보</h1>
    </div>

    <div class="table-wrapper">
        <table>
            <thead>
            <tr>
                <th>메뉴번호</th>
                <th>메뉴이름</th>
                <th>메뉴가격</th>
                <th>카테고리코드</th>
                <th>판매상태</th>
            </tr>
            </thead>
            <tbody>
            <tr>
                <td th:text="${result.menuCode}"></td>
                <td th:text="${result.menuName}"></td>
                <td th:text="${result.menuPrice} + '원'"></td>
                <td th:text="${result.categoryCode}"></td>
                <td>
                            <span th:class="${result.orderableStatus == 'Y' ? 'status-badge status-available' : 'status-badge status-unavailable'}"
                                  th:text="${result.orderableStatus == 'Y' ? '판매중' : '품절'}">
                            </span>
                </td>
            </tr>
            </tbody>
        </table>
    </div>
</div>
</body>
</html>
