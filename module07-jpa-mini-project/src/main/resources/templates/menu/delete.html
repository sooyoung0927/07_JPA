<!doctype html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>메뉴 삭제</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 40px 20px;
        }

        h1 {
            color: white;
            font-size: 32px;
            font-weight: 700;
            margin-bottom: 30px;
            text-align: center;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.2);
        }

        .container {
            background: white;
            padding: 40px 50px;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            max-width: 500px;
            width: 100%;
        }

        label {
            display: block;
            color: #333;
            font-weight: 600;
            font-size: 15px;
            margin-bottom: 8px;
        }

        input[type="number"] {
            width: 100%;
            padding: 12px 16px;
            border: 2px solid #e9ecef;
            border-radius: 10px;
            font-size: 15px;
            color: #333;
            background: #f8f9fa;
            margin-bottom: 20px;
        }

        button {
            width: 100%;
            padding: 16px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 17px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(102, 126, 234, 0.4);
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(102, 126, 234, 0.6);
        }

        #result {
            margin-top: 20px;
            text-align: center;
            font-size: 16px;
            font-weight: 600;
            color: #764ba2;
        }
    </style>
</head>
<body>
<h1>🗑️ 메뉴 삭제</h1>
<div class="container">
    <label>삭제할 메뉴 번호 : </label>
    <input type="number" id="menuCode" placeholder="메뉴 번호 입력">
    <button onclick="deleteMenu()">삭제하기</button>
    <p id="result"></p>
</div>

<script>
    function deleteMenu() {
        const menuCode = document.getElementById("menuCode").value;

        fetch(`/menu/delete/${menuCode}`, {
            method: "DELETE"
        })
            .then(res => res.text())
            .then(data => {
                document.getElementById("result").textContent = data; // "1번 메뉴 삭제 완료"
            })
    }
</script>
</body>
</html>
